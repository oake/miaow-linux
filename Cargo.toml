[package]
name = "miaow"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native GNOME one-to-one room-call client"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
anyhow = "1.0"
async-channel = "2.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
futures-util = "0.3"
gio = "0.22"
glib = "0.22"
gtk = { package = "gtk4", version = "0.11.4", features = ["gnome_47"] }
livekit = { version = "0.8.3", features = ["glib-main-loop", "rustls-tls-native-roots"] }
log = "0.4"
oxiaudio = "0.2.1"
rodio = { version = "0.21", default-features = false, features = [
  "playback",
  "symphonia-aac",
  "symphonia-flac",
  "symphonia-isomp4",
  "symphonia-mp3",
  "symphonia-vorbis",
  "symphonia-wav",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
sha2 = "0.10"
# output-threaded also makes Camera Send, required by our capture worker.
nokhwa = { version = "0.10.10", default-features = false, features = ["decoding", "input-v4l", "output-threaded"] }
secret-service = { version = "5.1", features = ["rt-tokio-crypto-rust"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }

[profile.release]
# The native WebRTC library does the performance-sensitive media work. LTO on
# this small GTK frontend substantially increases iterative link times without
# a meaningful runtime benefit.
lto = false
codegen-units = 16
strip = true
